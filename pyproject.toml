[project]
name = "custermer-help"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "openai>=3.15.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
