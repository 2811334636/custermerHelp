[project]
name = "custermer-help"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    # 不依赖 `langchain`（编排层）：项目没用 LCEL / agent，spec §2 明确
    # 把 langgraph* 编排栈列为非目标。langchain-core（接口）与
    # langchain-openai（provider 实现）已足够，且是分开发布的固定版本。
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "openai>=3.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "aiomysql>=0.3.2",
    "pymilvus>=3.0.2",
    # MySQL 8.4 的 caching_sha2_password 认证在非 TLS 连接下需要 RSA 加密；
    # 缺了它 aiomysql 会在连接时报 "cryptography package is required"。
    "cryptography>=42.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28.1",
    # 只有 evals/ 读 yaml，运行时不依赖
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
