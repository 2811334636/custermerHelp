<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能客服</title>
<style>
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 720px; margin: 0 auto; padding: 16px; }
  h3 { margin: 0 0 12px; }
  #list { display: flex; flex-direction: column; gap: 10px; min-height: 60vh; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .wrap { max-width: 76%; display: flex; flex-direction: column; align-items: flex-start; }
  .row.user .wrap { align-items: flex-end; }
  .bubble { padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: #1677ff; color: #fff; }
  .bot .bubble { background: #f1f1f1; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px;
           background: #e8e8e8; color: #666; margin-bottom: 4px; }
  .badge.err { background: #fff1f0; color: #cf1322; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1677ff; color: #fff; }
  button:disabled { background: #b9d4ff; }

  /* 回答中的引用编号：只有在 citations 里存在时才变成可点的小蓝标 */
  .cite { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 4px;
          margin: 0 1px; border: 1px solid #91caff; border-radius: 6px;
          background: #e6f4ff; color: #1677ff; cursor: pointer; }
  .cite:hover { background: #bae0ff; }

  /* done 之后追加的满意度反馈 */
  .feedback { display: flex; align-items: center; gap: 6px; margin-top: 4px;
              font-size: 12px; color: #888; }
  .feedback button { padding: 2px 8px; font-size: 13px; line-height: 20px;
                     border: 1px solid #ddd; border-radius: 8px;
                     background: #fff; color: #555; cursor: pointer; }
  .feedback button:hover:not(:disabled) { border-color: #1677ff; color: #1677ff; }
  .feedback button.active { background: #1677ff; border-color: #1677ff; color: #fff; }
  .feedback button:disabled { background: #f5f5f5; border-color: #eee; color: #bbb;
                              cursor: not-allowed; }
  .feedback button.active:disabled { background: #1677ff; border-color: #1677ff; color: #fff; }

  /* 引用原文弹窗：移动端收窄，正文区域可滚动 */
  .modal-overlay { position: fixed; inset: 0; z-index: 100; display: flex;
                   align-items: center; justify-content: center; padding: 16px;
                   background: rgba(0, 0, 0, .45); }
  .modal-overlay[hidden] { display: none; }
  .modal { display: flex; flex-direction: column; width: 100%; max-width: 560px;
           max-height: 80vh; overflow: hidden; background: #fff; border-radius: 12px;
           box-shadow: 0 12px 40px rgba(0, 0, 0, .2); }
  .modal-head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 0; }
  .modal-title { flex: 1; font-size: 15px; font-weight: 600; word-break: break-word; }
  .modal-close { flex: none; width: 30px; height: 30px; padding: 0; border: 0;
                 border-radius: 8px; background: #f2f2f2; color: #555;
                 font-size: 18px; line-height: 30px; cursor: pointer; }
  .modal-close:hover { background: #e6e6e6; }
  .modal-meta { padding: 6px 16px 0; font-size: 12px; color: #888; }
  .modal-body { padding: 12px 16px 18px; overflow-y: auto; min-height: 0;
                white-space: pre-wrap; word-break: break-word; color: #333;
                font-size: 14px; line-height: 1.6; }
  .modal-body.err { color: #cf1322; }
</style>
</head>
<body>
<h3>智能客服</h3>
<div id="list"></div>
<form id="form">
  <input id="input" placeholder="问点什么…" autocomplete="off">
  <button id="send">发送</button>
</form>
<script>
// 中文标签表放在前端：后端只发工具原始 name，加新工具时这张表落后也不会白屏，
// labelOf 会退回显示原始 name。
const TOOL_LABELS = {
  query_order: "查订单", query_product: "查商品",
  query_logistics: "查物流", query_faq: "查常见问题",
  create_ticket: "建工单",
};
const labelOf = (n) => TOOL_LABELS[n] || n;

let sessionId = null;
const list = document.getElementById("list");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addRow(who) {
  const row = document.createElement("div");
  row.className = "row " + who;
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  row.appendChild(wrap);
  list.appendChild(row);
  return wrap;
}

function addBubble(wrap, text) {
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  wrap.appendChild(b);
  return b;
}

function addBadge(wrap, text, bad) {
  const b = document.createElement("div");
  b.className = "badge" + (bad ? " err" : "");
  b.textContent = text;
  wrap.appendChild(b);
  return b;
}

// 把回答里的 [n] 渲染成小蓝标：只有 citations 里存在该 index 才可点，
// 其余文本用 TextNode 原样输出——绝不对模型输出用 innerHTML。
function renderAnswer(bubble, text, citations) {
  const byIndex = new Map();
  for (const c of citations) {
    if (c && Number.isInteger(c.index)) byIndex.set(c.index, c);
  }

  bubble.textContent = "";
  const re = /\[(\d+)\]/g;
  let last = 0;
  let m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) {
      bubble.appendChild(document.createTextNode(text.slice(last, m.index)));
    }
    const citation = byIndex.get(Number(m[1]));
    if (citation) {
      const badge = document.createElement("button");
      badge.type = "button";
      badge.className = "cite";
      badge.textContent = "[" + m[1] + "]";
      badge.title = "查看引用 " + m[1];
      badge.addEventListener("click", () => openCitation(citation));
      bubble.appendChild(badge);
    } else {
      bubble.appendChild(document.createTextNode(m[0]));
    }
    last = m.index + m[0].length;
  }
  if (last < text.length) {
    bubble.appendChild(document.createTextNode(text.slice(last)));
  }
}

// ---------- 引用原文弹窗 ----------
const overlay = document.createElement("div");
overlay.className = "modal-overlay";
overlay.hidden = true;

const modal = document.createElement("div");
modal.className = "modal";
const modalHead = document.createElement("div");
modalHead.className = "modal-head";
const modalTitle = document.createElement("div");
modalTitle.className = "modal-title";
modalTitle.textContent = "引用详情";
const modalClose = document.createElement("button");
modalClose.type = "button";
modalClose.className = "modal-close";
modalClose.textContent = "×";
modalClose.title = "关闭";
modalClose.setAttribute("aria-label", "关闭");
modalHead.append(modalTitle, modalClose);

const modalMeta = document.createElement("div");
modalMeta.className = "modal-meta";
const modalBody = document.createElement("div");
modalBody.className = "modal-body";

modal.append(modalHead, modalMeta, modalBody);
overlay.appendChild(modal);
document.body.appendChild(overlay);

// 每次打开/关闭都递增：晚到的旧请求不能覆盖用户当前查看的引用。
let modalSeq = 0;

function closeModal() {
  modalSeq += 1;
  overlay.hidden = true;
}

modalClose.addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !overlay.hidden) closeModal();
});

async function openCitation(citation) {
  const seq = ++modalSeq;
  modalTitle.textContent = citation.index != null ? "引用 [" + citation.index + "]" : "引用详情";
  modalMeta.textContent = citation.score != null ? "相关度：" + citation.score : "";
  modalBody.className = "modal-body";
  modalBody.textContent = "加载中…";
  overlay.hidden = false;

  if (!citation.chunk_id) {
    modalBody.className = "modal-body err";
    modalBody.textContent = "引用信息缺少 chunk_id，无法加载原文。";
    return;
  }

  try {
    const resp = await fetch("/api/chunks/" + encodeURIComponent(citation.chunk_id));
    if (seq !== modalSeq) return;
    if (!resp.ok) {
      if (resp.status === 404) {
        let msg = "";
        try {
          const data = await resp.json();
          msg = data.message || "";
        } catch (_) { /* 非 JSON 错误体：退回通用文案 */ }
        if (seq !== modalSeq) return;
        modalBody.className = "modal-body err";
        modalBody.textContent = msg ? "未找到引用内容：" + msg : "未找到引用内容（404）。";
      } else {
        modalBody.className = "modal-body err";
        modalBody.textContent = "加载引用失败（HTTP " + resp.status + "）。";
      }
      return;
    }
    const data = await resp.json();
    if (seq !== modalSeq) return;
    modalTitle.textContent = data.section_path || data.source || "引用详情";
    modalBody.className = "modal-body";
    modalBody.textContent = data.content || "（该引用没有正文内容）";
  } catch (err) {
    if (seq !== modalSeq) return;
    modalBody.className = "modal-body err";
    modalBody.textContent = "网络异常，引用加载失败，请稍后重试。";
  }
}

// ---------- 满意度反馈 ----------
function addFeedback(wrap, messageId) {
  const box = document.createElement("div");
  box.className = "feedback";
  const up = document.createElement("button");
  up.type = "button";
  up.textContent = "👍";
  up.title = "有帮助";
  const down = document.createElement("button");
  down.type = "button";
  down.textContent = "👎";
  down.title = "没帮助";
  const status = document.createElement("span");

  if (messageId == null) {
    up.disabled = true;
    down.disabled = true;
    up.title = down.title = "该条消息未保存，无法反馈";
    box.append(up, down, status);
    wrap.appendChild(box);
    return;
  }

  let locked = false;
  const send = async (feedback, chosen) => {
    if (locked) return;
    locked = true;
    up.disabled = true;
    down.disabled = true;
    try {
      const resp = await fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message_id: messageId, feedback }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      chosen.classList.add("active");
      status.textContent = "已反馈";
      // 成功后保持 disabled：一条消息只能反馈一次。
    } catch (err) {
      locked = false;
      up.disabled = false;
      down.disabled = false;
      status.textContent = "反馈失败，请重试";
    }
  };
  up.addEventListener("click", () => send("thumbs_up", up));
  down.addEventListener("click", () => send("thumbs_down", down));

  box.append(up, down, status);
  wrap.appendChild(box);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendBtn.disabled = true;

  addBubble(addRow("user"), text);

  const wrap = addRow("bot");
  let bubble = null;
  // call_id -> {el, name}。名字必须在 start 帧记下来：end 帧只带 call_id /
  // ok / summary，**不带 name**（后端有意不重复发送），只按 end 帧渲染会
  // 得到「🔧 undefined」。
  const badges = {};

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(sessionId ? { session_id: sessionId, message: text } : { message: text }),
    });
    if (!resp.ok) {
      addBadge(wrap, "请求失败：" + resp.status, true);
      return;
    }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    // 一次 read 不等于一帧：SSE 分块是任意的，必须自己缓冲、按空行切帧。
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const blocks = buf.split("\n\n");
      buf = blocks.pop();
      for (const block of blocks) {
        let name = null, data = null;
        for (const line of block.split("\n")) {
          if (line.startsWith("event: ")) name = line.slice(7);
          else if (line.startsWith("data: ")) data = JSON.parse(line.slice(6));
        }
        if (!name || !data) continue;

        if (name === "meta") {
          sessionId = data.session_id;
        } else if (name === "tool") {
          if (data.phase === "start") {
            badges[data.call_id] = {
              el: addBadge(wrap, "⏳ " + labelOf(data.name) + "…"),
              name: data.name,
            };
          } else if (data.phase === "end") {
            const slot = badges[data.call_id];
            const el = slot ? slot.el : addBadge(wrap, "");
            const name = slot ? slot.name : data.name;   // 兜底：万一没收到 start
            el.textContent = (data.ok ? "🔧 " : "⚠️ ") + labelOf(name) + " · " + data.summary;
            if (!data.ok) el.classList.add("err");
            if (bubble) wrap.appendChild(bubble);   // 徽章始终排在正文上方
          }
        } else if (name === "delta") {
          // 逐帧追加，不缓冲——流式就是要看得见字一个个出来
          if (!bubble) bubble = addBubble(wrap, "");
          bubble.textContent += data.text;
        } else if (name === "done") {
          // 流式期间保持纯文本追加；收尾时一次性换成带引用小蓝标的版本。
          const citations = Array.isArray(data.citations) ? data.citations : [];
          if (bubble) renderAnswer(bubble, bubble.textContent, citations);
          addFeedback(wrap, data.message_id == null ? null : data.message_id);
        } else if (name === "error") {
          addBadge(wrap, "出错：" + data.message, true);
        }
      }
    }
  } catch (err) {
    addBadge(wrap, "连接中断：" + err, true);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
