services:
  mysql:
    image: mysql:8.4
    container_name: custermerhelp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: customer_service
      MYSQL_USER: app
      MYSQL_PASSWORD: apppw
      # 必须有 locale：镜像默认 POSIX，mysql 客户端会按 latin1 处理。
      # 两个实测后果：① initdb 执行 01-schema.sql 时把文件里的 UTF-8 中文
      # 当 latin1 存库，ENUM('进行中',...) 落库成双重编码乱码（HEX 为
      # C3A8C2BF... 而非 E8BF9BE8A18C...），后续按中文取值会失败；
      # ② `mysql -e "... LIKE '%退货%'"` 永远匹配不到（返回 0）。
      LANG: C.UTF-8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主 3306 被本机 MySQL80 服务 + VMware NAT 转发规则(3306=192.168.150.128:3306)占用,
      # 实测 Docker 无论绑 0.0.0.0:3306 还是 127.0.0.1:3306 都报
      # "ports are not available ... /forwards/expose returned unexpected status: 500",
      # 故映射到 3307(与 MewHelp 同机同因的方案一致)。
      # 改这里必须同步改 .env / .env.example 的 APP_DB_URL。
      - "3307:3306"
    volumes:
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- ch03 · Milvus Standalone 依赖 ----
  # Milvus 3.0 standalone 需要 etcd（元数据）+ MinIO（对象存储）。

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: custermerhelp-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    # 必须用 compose 服务名：Milvus 容器通过 etcd:2379 访问它。
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # ⚠️ 官方 minio/minio 仓库已从 Docker Hub / quay 下架，此 tag 拉不到。
    # 本机可用仅因镜像已在本地缓存（见 Task 0 Ruling 5）。
    # 禁止 `docker compose pull`，也不要加 pull_policy: always；
    # 干净机器 / 清空镜像后需自备同版本镜像。
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: custermerhelp-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    # tag 由 Task 0 实测确定（server 3.0.0 ↔ pymilvus 3.0.2）
    image: milvusdb/milvus:v3.0.0
    container_name: custermerhelp-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    # 长语法：等 etcd / MinIO 真正可服务后再启动 Milvus，避免启动即连不上。
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Milvus 官方 compose 携带此参数；缺了会因容器默认 seccomp 起不来。
    security_opt:
      - "seccomp:unconfined"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
