# ch05 Task 4 意图标注集：20 条，7 类（每类 ≥2）。
#
# 本集证明：常见用户口吻下 7 个标签可分，且两组易混边界有明确判定——
#   物流 vs 退货退款（"退款进度"问的是钱，不是包裹）
#   投诉 vs 售后（"客服态度差"针对服务，而非商品问题本身）
# 另含 1 条信息不足的模糊样本，故意标注为售后（已购商品出问题，先按售后处理）。
#
# 本集不证明：对任意改写/对抗输入都稳健。20 条样本量很小，100% 只代表本集无失败，
# 不等于线上泛化准确率。样本已刻意避开 INTENT_PROMPT 的例句（无逐字/换字复制），
# 但仍与标签描述同域，仍可能高估模型在陌生表达上的表现。
- {query: "我的包裹卡在杭州三天了，是不是丢了", intent: 物流}
- {query: "快递员说放门口，但我没收到，帮我看看", intent: 物流}
- {query: "我昨天下的单还没动静，麻烦催一下", intent: 订单}
- {query: "买重复了，多出来的那单可以不要吗", intent: 订单}
- {query: "这个订单是用哪个账号下的，我想确认下", intent: 订单}
- {query: "这个锅能在电磁炉上用吗", intent: 商品咨询}
- {query: "你们家猫粮的成分表能发我看看吗", intent: 商品咨询}
- {query: "东西收到了但不合心意，能退吗", intent: 退货退款}
- {query: "七天无理由是从签收那天算吗", intent: 退货退款}
# 边界：问的是退款到账进度（钱），不是包裹位置（物流）。
- {query: "退款进度到哪了", intent: 退货退款}
- {query: "换货的话运费谁出", intent: 退货退款}
- {query: "新买的电饭煲按键不灵，能修吗", intent: 售后}
- {query: "发票抬头开错了，可以重开吗", intent: 售后}
# 模糊样本：信息不足，但"买的东西有问题"属于已购商品售后，故意标注售后。
- {query: "我买的东西有点问题", intent: 售后}
# 边界：不满指向客服态度/服务过程，不是商品售后问题（投诉）。
- {query: "客服态度差，我要个说法", intent: 投诉}
- {query: "说好补偿结果一直没人联系，太气人了", intent: 投诉}
- {query: "我要找你们主管反映一下", intent: 投诉}
- {query: "你们处理问题也太敷衍了吧", intent: 投诉}
- {query: "在吗", intent: 闲聊}
- {query: "今天心情不错，随便聊聊", intent: 闲聊}
