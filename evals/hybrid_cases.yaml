# Task 6 混合检索评估集：20 条人工标注 query。
#
# 标注依据：2026-10-20 直接查询 customer_service.knowledge_chunks 的 28 个
# 「已向量化」知识块（chunk_id / questions / answer），ground_truth_ids 全部
# 是库中真实存在的 chunk_id，不是凭文档结构猜测的编号。
#
# 字段：
#   query             用户原话
#   ground_truth_ids  回答该问题所必需的知识块（可多个；Recall 的分母）
#   difficulty        easy | medium | hard
#   query_type        fact | procedure | comparison（报告按此分桶）
#
# 标注口径（Fix round 1）：**每个不同的答案只保留一个代表块**。知识库里
# 售后政策.md / 商品FAQ.md / 平台规则.md 的正文与 faq:* 短问法条目大量
# 重复（同一段答案的两种载体）；若把两份都写进 ground_truth，Recall 就变成
# "两份副本是否都召回"，而不是"答案是否召回"。因此：
#   - 同一答案的多个 chunk 只保留一个代表；重复时优先保留 faq:* 问答条目
#     （用户问句的检索目标），没有 faq 副本时才用 policy 源块。
#   - 一个问题的答案若由多个不同事实组成（如"价保 15 天"+"逾期不受理"），
#     每个事实仍各保留一个代表块。
# 例：Q16 退货/换货流程 = faq:110（退货流程）+ faq:112（换货流程）；
#     Q18 价保过期 = faq:119（15 天价保）+ 平台规则.md:1（逾期不受理）。
